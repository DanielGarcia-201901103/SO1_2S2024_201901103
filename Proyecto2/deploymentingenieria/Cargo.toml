[package]
name = "deploymentingenieria"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cliente-rust"
path = "src/main.rs"

[dependencies]
actix-web = "4.9"
tokio = { version = "1.0", features = ["macros","rt-multi-thread"] }
tonic = "0.7"  # Para gRPC
prost = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tonic-build = "0.7"         # Para generar código a partir de proto