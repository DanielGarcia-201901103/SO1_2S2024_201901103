apiVersion: apps/v1
kind: Deployment
metadata:
  name: agronomia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agronomia
  template:
    metadata:
      labels:
        app: agronomia
    spec:
      containers:
      - name: agronomia
        image: jdanielprogram/go-api:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"