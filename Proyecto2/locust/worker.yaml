apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-worker
spec:
  replicas: 3  # Define cuántos workers quieres
  selector:
    matchLabels:
      app: locust-worker
  template:
    metadata:
      labels:
        app: locust-worker
    spec:
      containers:
      - name: locust-worker
        image: gcr.io/[PROJECT_ID]/locust-load-tester:latest
        args: ["--worker", "--master-host=locust-master"]
        ports:
        - containerPort: 5557
        - containerPort: 5558
